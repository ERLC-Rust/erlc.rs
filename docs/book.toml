[book]
title = "erlc.rs"
description = "Async, type-safe Rust SDK for the ER:LC Private Server API"
language = "en"
src = "."

[build]
build-dir = "../target/site"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
site-url = "/erlc.rs/"
git-repository-url = "https://github.com/ERLC-Rust/erlc.rs"
edit-url-template = "https://github.com/ERLC-Rust/erlc.rs/edit/main/docs/{path}"
additional-css = ["css/custom.css"]

[output.html.playground]
runnable = false

[output.html.search]
enable = true
