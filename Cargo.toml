[package]
name = "erlc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Async, type-safe Rust SDK for the ER:LC Private Server API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ERLC-Rust/erlc.rs"
readme = "README.md"
keywords = ["erlc", "roblox", "api", "sdk", "async"]
categories = ["api-bindings", "asynchronous"]
# Distributed from GitHub only; never published to crates.io.
publish = false

[features]
default = ["rustls"]
# TLS via rustls (pure Rust, no system OpenSSL needed).
rustls = ["reqwest/rustls"]
# TLS via the platform's native library (SChannel, Secure Transport, OpenSSL).
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["http2", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"
